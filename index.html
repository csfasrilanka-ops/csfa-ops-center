<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSFA | Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #020617; font-family: system-ui, sans-serif; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; padding: 1.25rem; transition: all 0.3s; }
        .card:hover { border-color: #3b82f6; }
        .input { background: #020617 !important; border: 1px solid #334155 !important; padding: 0.75rem; border-radius: 0.75rem; color: white !important; width: 100%; outline: none; font-size: 15px; }
        .btn-primary { background: #2563eb; color: white; padding: 0.75rem; border-radius: 0.75rem; font-weight: 800; cursor: pointer; text-transform: uppercase; border: none; }
        .btn-save { background: #10b981; color: white; padding: 0.6rem 1.2rem; border-radius: 0.75rem; font-size: 12px; font-weight: 900; }
        .btn-delete { color: #ef4444; font-weight: bold; padding: 0.5rem; font-size: 20px; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
        .hidden { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- LOGIN SCREEN -->
    <div id="login-zone" class="fixed inset-0 z-50 flex items-center justify-center bg-[#020617] px-4">
        <div class="card w-full max-w-sm text-center shadow-2xl">
            <h1 class="text-2xl font-black italic uppercase mb-8">Pilot <span class="text-blue-500">Access</span></h1>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="input">
                <input type="password" id="password" placeholder="Password" class="input">
                <button onclick="signIn()" class="btn-primary w-full">Open Command Center</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto pb-20">
        <header class="flex justify-between items-center mb-8 border-b border-white/5 pb-6">
            <div>
                <h1 class="text-xl font-black uppercase italic text-white tracking-widest leading-none">CSFA <span class="text-blue-600">COMMAND</span></h1>
                <span class="text-[9px] text-slate-500 uppercase tracking-widest font-mono mt-1 block">Airspace & Inventory Ops</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative">
                    <button onclick="toggleNoticeModal()" class="relative p-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-blue-500 text-white transition flex items-center justify-center cursor-pointer">
                        <svg class="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span id="notice-badge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-blue-600 text-[10px] font-black rounded-full flex items-center justify-center text-white border-2 border-slate-950">0</span>
                    </button>

                    <div id="notice-modal" class="hidden absolute right-0 mt-3 w-80 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl z-50">
                        <div class="flex justify-between items-center border-b border-white/5 pb-2 mb-3">
                            <span class="text-xs font-black uppercase tracking-wider text-white">Pending Pass Requests</span>
                            <span id="notice-count" class="text-[9px] text-blue-400 font-mono">0 Pending</span>
                        </div>
                        <div id="notice-list" class="space-y-2 max-h-60 overflow-y-auto text-xs"></div>
                    </div>
                </div>

                <button onclick="signOut()" class="text-[10px] font-black text-slate-500 hover:text-red-400 uppercase border border-slate-800 px-4 py-2.5 rounded-full transition">Logout</button>
            </div>
        </header>

        <!-- TABS -->
        <nav class="flex gap-8 text-[11px] font-black uppercase tracking-widest mb-10 overflow-x-auto no-scrollbar border-b border-white/5">
            <button onclick="switchTab('sessions')" id="t-sessions" class="pb-4 tab-active whitespace-nowrap">Flight Sessions</button>
            <button onclick="switchTab('passes')" id="t-passes" class="pb-4 whitespace-nowrap flex items-center gap-2">
                <span>Site Passes & Pricing</span>
                <span id="pass-indicator" class="hidden w-2 h-2 rounded-full bg-yellow-400"></span>
            </button>
            <button onclick="switchTab('locations')" id="t-locations" class="pb-4 whitespace-nowrap">Flying Sites</button>
            <button onclick="switchTab('addons')" id="t-addons" class="pb-4 whitespace-nowrap">Add-ons</button>
            <button onclick="switchTab('settings')" id="t-settings" class="pb-4 whitespace-nowrap">Settings</button>
        </nav>

        <div id="content-area"></div>
    </div>

    <script>
        const SB_URL = "https://rbvbkibhxmmnpzntbzvt.supabase.co";
        const SB_KEY = "sb_publishable_KHW9RkQqLeB1YMSrSSHowg_tOe_KjdT"; 
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        let appData = { sessions: [], locations: [], addons: [], config: [], passes: [], passTiers: [] };
        let currentTab = 'sessions';

        // --- AUTH ---
        window.signIn = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await client.auth.signInWithPassword({ email, password });
            if (error) alert(error.message); else checkAuth();
        };

        window.signOut = async function() { await client.auth.signOut(); location.reload(); };

        async function checkAuth() {
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                document.getElementById('login-zone').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadData();
            }
        }

        async function loadData() {
            const [s, l, a, c, p, pt] = await Promise.all([
                client.from('booking_sessions').select('*').order('id', { ascending: false }),
                client.from('booking_locations').select('*').order('id', { ascending: true }),
                client.from('booking_addons').select('*').order('id', { ascending: true }),
                client.from('booking_config').select('*'),
                client.from('site_pass_requests').select('*').order('created_at', { ascending: false }),
                client.from('site_pass_tiers').select('*').order('duration_days', { ascending: true })
            ]);
            
            appData = { 
                sessions: s.data || [], 
                locations: l.data || [], 
                addons: a.data || [], 
                config: c.data || [], 
                passes: p.data || [],
                passTiers: pt.data || []
            };

            updateNotifications();
            switchTab(currentTab);
        }

        function updateNotifications() {
            const pending = appData.passes.filter(p => p.status === 'pending_verification');
            const badge = document.getElementById('notice-badge');
            const count = document.getElementById('notice-count');
            const list = document.getElementById('notice-list');
            const indicator = document.getElementById('pass-indicator');

            if (pending.length > 0) {
                badge.innerText = pending.length;
                badge.classList.remove('hidden');
                indicator.classList.remove('hidden');
                count.innerText = `${pending.length} Pending`;

                list.innerHTML = pending.map(item => `
                    <div onclick="switchTab('passes')" class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-blue-500 cursor-pointer">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-white uppercase text-[11px]">${item.pilot_name}</span>
                            <span class="text-[9px] text-yellow-400 font-mono">LKR ${item.total_fee}</span>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-0.5">${item.site_name} • ${item.duration_days} Day(s)</p>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                indicator.classList.add('hidden');
                count.innerText = `All Clear`;
                list.innerHTML = `<p class="text-slate-500 italic py-2 text-center text-xs">No pending flight pass requests.</p>`;
            }
        }

        window.toggleNoticeModal = function() {
            document.getElementById('notice-modal')?.classList.toggle('hidden');
        };

        // --- UI TABS ---
        window.switchTab = function(tab) {
            currentTab = tab;
            const area = document.getElementById('content-area');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active', 'text-blue-500'));
            const activeBtn = document.getElementById('t-' + tab);
            if (activeBtn) activeBtn.classList.add('tab-active', 'text-blue-500');
            document.getElementById('notice-modal')?.classList.add('hidden');

            // 1. SESSIONS
            if(tab === 'sessions') {
                area.innerHTML = `
                    <div class="card border-blue-500/30 mb-10">
                        <h3 class="text-blue-500 font-bold uppercase text-[10px] mb-4 tracking-widest italic">Plan Flight Mission</h3>
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
                            <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Date</label><input type="date" id="new-date" class="input"></div>
                            <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Time</label><input type="time" id="new-time" class="input" value="08:30"></div>
                            <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Site</label><select id="new-loc" class="input">${appData.locations.map(l => `<option value="${l.id}">${l.name}</option>`).join('')}</select></div>
                            <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Seats</label><input type="number" id="new-slots" class="input" value="5"></div>
                            <button onclick="createNewSession()" class="btn-primary">Add Flight</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        ${appData.sessions.map(s => `
                            <div class="card space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                    <div class="md:col-span-1"><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Date Label</label><input id="sess-date-${s.id}" class="input font-bold" value="${s.date_text}"></div>
                                    <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Launch Time</label><input id="sess-time-${s.id}" class="input text-center text-blue-300" value="${s.start_time || '08:30 AM'}"></div>
                                    <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Seats</label><input type="number" id="sess-slots-${s.id}" class="input text-center text-blue-500 font-bold" value="${s.slots_available}"></div>
                                    <div><label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Site</label><select id="sess-loc-${s.id}" class="input">${appData.locations.map(l => `<option value="${l.id}" ${l.id === s.location_id ? 'selected' : ''}>${l.name}</option>`).join('')}</select></div>
                                </div>
                                <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-2 border-t border-white/5">
                                    <button onclick="broadcastWhatsApp(${s.id})" class="bg-green-600/20 text-green-400 border border-green-500/30 px-6 py-2 rounded-lg text-[10px] font-black uppercase w-full md:w-auto hover:bg-green-600 hover:text-white transition-all">Broadcast WhatsApp</button>
                                    <div class="flex gap-2 w-full md:w-auto">
                                        <button onclick="saveSession(${s.id})" class="btn-save flex-1 md:flex-none">SAVE</button>
                                        <button onclick="deleteRow('booking_sessions', ${s.id})" class="p-2 text-red-500">✕</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 2. PASSES TAB: INCLUDES PACKAGE PRICING BACKEND + REQUESTS
            if(tab === 'passes') {
                area.innerHTML = `
                    <!-- SECTION 1: MANAGE PASS PRICING & TIERS (FOR MEMBERS WEBSITE) -->
                    <div class="card border-yellow-500/30 mb-10 space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <div>
                                <h3 class="text-yellow-400 font-black uppercase text-xs tracking-widest italic">Takeoff Pass Packages & Pricing Tiers</h3>
                                <p class="text-[10px] text-slate-400 mt-1">Configure the packages and fees shown to visiting pilots on the club portal.</p>
                            </div>
                            <button onclick="addPassTier()" class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-yellow-500 hover:text-slate-950 transition">
                                + Add Pass Package
                            </button>
                        </div>

                        <div class="grid gap-3">
                            ${appData.passTiers.map(t => `
                                <div class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                    <div class="md:col-span-2">
                                        <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Package Title</label>
                                        <input id="tier-name-${t.id}" class="input text-sm font-bold text-white" value="${t.name}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Duration (Days)</label>
                                        <input type="number" id="tier-days-${t.id}" min="1" class="input text-center text-sm font-bold text-yellow-400" value="${t.duration_days}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-500 uppercase block mb-1">Price (LKR)</label>
                                        <input type="number" id="tier-price-${t.id}" class="input text-right text-sm font-black text-yellow-400" value="${t.price}">
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="savePassTier(${t.id})" class="btn-save flex-1">SAVE</button>
                                        <button onclick="deleteRow('site_pass_tiers', ${t.id})" class="btn-delete">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- SECTION 2: INCOMING PILOT PASS REQUESTS -->
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-blue-500 uppercase text-xs italic font-black tracking-widest">Incoming Pilot Pass Applications</h2>
                            <p class="text-[10px] text-slate-500 mt-1">Audit credentials, adjust specific dates/fees, and broadcast WhatsApp verification.</p>
                        </div>
                    </div>

                    <div class="space-y-6">
                        ${appData.passes.length > 0 ? appData.passes.map(p => `
                            <div class="card space-y-5 border-slate-800 bg-slate-900/90">
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">Pilot Name</label>
                                        <input id="pass-name-${p.id}" class="input font-bold" value="${p.pilot_name}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-blue-400 uppercase block mb-1">Launch Mountain</label>
                                        <select id="pass-site-${p.id}" class="input text-blue-400 font-bold">
                                            ${appData.locations.map(l => `<option value="${l.name}" ${l.name === p.site_name ? 'selected' : ''}>${l.name}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">Starting Flight Date</label>
                                        <input type="date" id="pass-date-${p.id}" class="input font-mono text-sm" value="${p.start_date}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">Permit Status</label>
                                        <select id="pass-status-${p.id}" class="input uppercase text-xs font-black">
                                            <option value="pending_verification" ${p.status === 'pending_verification' ? 'selected' : ''}>⏳ Pending Verification</option>
                                            <option value="issued" ${p.status === 'issued' ? 'selected' : ''}>✅ Issued / Approved</option>
                                            <option value="rejected" ${p.status === 'rejected' ? 'selected' : ''}>❌ Rejected</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end pt-3 border-t border-slate-800/80">
                                    <div>
                                        <label class="text-[9px] font-bold text-yellow-500 uppercase block mb-1">Pass Duration (Days)</label>
                                        <input type="number" min="1" id="pass-days-${p.id}" class="input font-bold text-yellow-400 text-center" value="${p.duration_days}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-yellow-500 uppercase block mb-1">Total Fee (LKR)</label>
                                        <input type="number" id="pass-fee-${p.id}" class="input font-black text-yellow-400 text-right" value="${p.total_fee}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">Pilot License #</label>
                                        <input id="pass-license-${p.id}" class="input font-mono text-xs uppercase" value="${p.appi_fai_number || ''}">
                                    </div>
                                    <div>
                                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">Glider Model</label>
                                        <input id="pass-glider-${p.id}" class="input text-xs" value="${p.glider_details || ''}">
                                    </div>
                                </div>

                                <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-3 border-t border-white/5">
                                    <div class="text-xs font-mono text-slate-400">
                                        <span>📞 ${p.pilot_phone}</span> • <span>✉️ ${p.pilot_email}</span>
                                    </div>
                                    <div class="flex items-center gap-3 w-full md:w-auto">
                                        <button onclick="whatsappPilotPass('${p.id}')" class="bg-green-600/20 text-green-400 border border-green-500/30 px-5 py-2.5 rounded-xl text-[10px] font-black uppercase hover:bg-green-600 hover:text-white transition-all">
                                            💬 WhatsApp Briefing
                                        </button>
                                        <button onclick="savePass('${p.id}')" class="btn-save flex-1 md:flex-none">SAVE</button>
                                        <button onclick="deleteRow('site_pass_requests', '${p.id}')" class="btn-delete">✕</button>
                                    </div>
                                </div>
                            </div>
                        `).join('') : '<p class="text-slate-500 italic py-8 text-center text-xs">No site pass requests recorded.</p>'}
                    </div>
                `;
            }

            // 3. LOCATIONS
            if(tab === 'locations') {
                area.innerHTML = `
                    <div class="mb-6"><button onclick="addLocation()" class="btn-primary px-10">+ Create New Site</button></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${appData.locations.map(l => `
                            <div class="card space-y-4">
                                <input id="loc-name-${l.id}" class="input font-bold" value="${l.name}">
                                <div class="flex gap-2">
                                    <select id="loc-status-${l.id}" class="input !text-xs uppercase"><option value="available" ${l.status === 'available' ? 'selected' : ''}>Operational</option><option value="not-flyable" ${l.status === 'not-flyable' ? 'selected' : ''}>Blown Out</option></select>
                                    <button onclick="saveLocation(${l.id})" class="btn-save">SAVE</button>
                                    <button onclick="deleteRow('booking_locations', ${l.id})" class="p-2 text-red-500">✕</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 4. ADDONS
            if(tab === 'addons') {
                area.innerHTML = `
                    <div class="mb-6"><button onclick="addAddon()" class="btn-primary px-10">+ Create New Addon</button></div>
                    <div class="space-y-4">
                        ${appData.addons.map(a => `
                            <div class="card space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="md:col-span-2"><label class="text-[9px] font-bold text-slate-500 uppercase ml-2">Name</label><input id="add-name-${a.id}" class="input" value="${a.name}"></div>
                                    <div><label class="text-[9px] font-bold text-slate-500 uppercase ml-2">Price (LKR)</label><input type="number" id="add-price-${a.id}" class="input text-blue-400 font-bold" value="${a.price}"></div>
                                </div>
                                <div><label class="text-[9px] font-bold text-slate-500 uppercase ml-2">Description</label><input id="add-desc-${a.id}" class="input text-xs" value="${a.description || ''}"></div>
                                <div class="flex gap-2">
                                    <select id="add-status-${a.id}" class="input !text-xs uppercase"><option value="active" ${a.status === 'active' ? 'selected' : ''}>Visible</option><option value="inactive" ${a.status === 'inactive' ? 'selected' : ''}>Hidden</option></select>
                                    <button onclick="saveAddon(${a.id})" class="btn-save w-full">SAVE ADDON</button>
                                    <button onclick="deleteRow('booking_addons', ${a.id})" class="p-2 text-red-500">✕</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // 5. SETTINGS
            if(tab === 'settings') {
                const base = appData.config.find(c => c.key === 'basePrice')?.value || 20000;
                area.innerHTML = `
                    <div class="card max-w-md space-y-6">
                        <h2 class="text-blue-500 font-black uppercase text-xs italic tracking-widest">Global Configuration</h2>
                        <div><label class="text-[9px] font-bold text-slate-500 uppercase block mb-2">Pilot Base Rate (LKR)</label><input id="cfg-price" type="number" value="${base}" class="input text-2xl font-black text-blue-400"></div>
                        <button onclick="saveGlobalConfig()" class="btn-primary w-full">Apply Live Changes</button>
                    </div>
                `;
            }
        };

        // --- MANAGE PASS TIERS & PACKAGES ---
        window.addPassTier = async function() {
            const name = prompt("Package Name (e.g. 5-Day Alpine Pass):");
            if (!name) return;
            const days = parseInt(prompt("Duration in Days:", "5")) || 5;
            const price = parseInt(prompt("Total Fee in LKR:", "25000")) || 25000;

            const { error } = await client.from('site_pass_tiers').insert([{
                name: name,
                duration_days: days,
                price: price,
                status: 'active'
            }]);
            if (error) alert(error.message); else loadData();
        };

        window.savePassTier = async function(id) {
            const payload = {
                name: document.getElementById(`tier-name-${id}`).value,
                duration_days: parseInt(document.getElementById(`tier-days-${id}`).value) || 1,
                price: parseInt(document.getElementById(`tier-price-${id}`).value) || 5000
            };
            const { error } = await client.from('site_pass_tiers').update(payload).eq('id', id);
            if (error) alert(error.message);
            else { alert("Pass package updated!"); loadData(); }
        };

        // --- PASS SAVING ---
        window.savePass = async function(id) {
            const payload = {
                pilot_name: document.getElementById(`pass-name-${id}`).value,
                site_name: document.getElementById(`pass-site-${id}`).value,
                start_date: document.getElementById(`pass-date-${id}`).value,
                duration_days: parseInt(document.getElementById(`pass-days-${id}`).value) || 1,
                total_fee: parseInt(document.getElementById(`pass-fee-${id}`).value) || 0,
                status: document.getElementById(`pass-status-${id}`).value,
                appi_fai_number: document.getElementById(`pass-license-${id}`).value,
                glider_details: document.getElementById(`pass-glider-${id}`).value
            };

            const { error } = await client.from('site_pass_requests').update(payload).eq('id', id);
            if (error) alert(error.message);
            else { alert("Pass updated."); loadData(); }
        };

        window.whatsappPilotPass = function(id) {
            const pass = appData.passes.find(p => p.id === id);
            if (!pass) return;
            const site = document.getElementById(`pass-site-${id}`)?.value || pass.site_name;
            const startDate = document.getElementById(`pass-date-${id}`)?.value || pass.start_date;
            const days = document.getElementById(`pass-days-${id}`)?.value || pass.duration_days;
            const fee = document.getElementById(`pass-fee-${id}`)?.value || pass.total_fee;
            const status = document.getElementById(`pass-status-${id}`)?.value || pass.status;
            const cleanPhone = pass.pilot_phone.replace(/[^0-9]/g, '');
            const msg = `👋 Hi ${pass.pilot_name},\n\nThis is CSFA Airspace Operations regarding your *Takeoff Site Pass* for *${site}*.\n\n📅 Date: *${startDate}*\n⏳ Duration: *${days} Day(s)*\n💰 Fee: *LKR ${parseInt(fee).toLocaleString()}*\n🛡️ Status: *${status.toUpperCase()}*\n\nOur duty pilot will coordinate your launch marshal briefing.`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.broadcastWhatsApp = function(id) {
            const date = document.getElementById(`sess-date-${id}`).value;
            const time = document.getElementById(`sess-time-${id}`).value;
            const slots = document.getElementById(`sess-slots-${id}`).value;
            const siteName = document.getElementById(`sess-loc-${id}`).selectedOptions[0].text;
            const msg = `🪂 *CSFA FLIGHT UPDATE*\n\nWe are flying at *${siteName}*!\n\n📅 *Date:* ${date}\n⏰ *Mission Start:* ${time}\n🎟️ *Availability:* Only ${slots} slots remaining.\n\nReserve your flight now at: https://csfa.lk/booking/`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // --- SESSIONS & LOCATIONS HANDLERS ---
        window.createNewSession = async function() {
            const dateVal = document.getElementById('new-date').value;
            const timeVal = document.getElementById('new-time').value;
            if(!dateVal || !timeVal) return alert("Select date and time.");
            const dateObj = new Date(dateVal);
            const formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: '2-digit' });
            const [h, m] = timeVal.split(':');
            const ampm = h >= 12 ? 'PM' : 'AM';
            const formattedTime = `${((h % 12) || 12)}:${m} ${ampm}`;

            await client.from('booking_sessions').insert([{ 
                date_text: formattedDate, slots_available: parseInt(document.getElementById('new-slots').value), 
                location_id: parseInt(document.getElementById('new-loc').value), start_time: formattedTime, status: 'active' 
            }]);
            loadData();
        };

        window.saveSession = async function(id) {
            await client.from('booking_sessions').update({ 
                date_text: document.getElementById(`sess-date-${id}`).value,
                start_time: document.getElementById(`sess-time-${id}`).value,
                slots_available: parseInt(document.getElementById(`sess-slots-${id}`).value),
                location_id: parseInt(document.getElementById(`sess-loc-${id}`).value)
            }).eq('id', id);
            alert("Session Updated.");
        };

        window.addLocation = async function() {
            const name = prompt("Site Name:");
            if(name) { await client.from('booking_locations').insert([{ name, status: 'available' }]); loadData(); }
        };

        window.saveLocation = async function(id) {
            await client.from('booking_locations').update({ name: document.getElementById(`loc-name-${id}`).value, status: document.getElementById(`loc-status-${id}`).value }).eq('id', id);
            alert("Site Saved.");
        };

        window.addAddon = async function() {
            const name = prompt("Addon Name:");
            if(name) { await client.from('booking_addons').insert([{ name, price: 5000, description: '', status: 'active' }]); loadData(); }
        };

        window.saveAddon = async function(id) {
            await client.from('booking_addons').update({ 
                name: document.getElementById(`add-name-${id}`).value, 
                price: parseInt(document.getElementById(`add-price-${id}`).value),
                description: document.getElementById(`add-desc-${id}`).value,
                status: document.getElementById(`add-status-${id}`).value 
            }).eq('id', id);
            alert("Add-on Saved.");
            loadData();
        };

        window.saveGlobalConfig = async function() {
            await client.from('booking_config').update({ value: document.getElementById('cfg-price').value }).eq('key', 'basePrice');
            alert("Global configuration applied.");
            loadData();
        };

        window.deleteRow = async function(table, id) {
            if(confirm("Confirm deletion?")) {
                const { error } = await client.from(table).delete().eq('id', id);
                if(error) alert(error.message);
                else loadData();
            }
        };

        checkAuth();
    </script>
</body>
</html>
